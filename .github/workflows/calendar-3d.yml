name: 3D contribution calendar

on:
  schedule:
    - cron: '45 21 * * *'   # nightly, 03:15 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        with:
          # writes profile-3d-contrib/profile-night-view.svg among others
          setting_json: ./scripts/3d-settings.json

      - name: Commit
        run: |
          git config user.name  "profile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet || git commit -m "chore: refresh 3D calendar [skip ci]"
          git push
