<svg xmlns="http://www.w3.org/2000/svg" width="840" height="114" viewBox="0 0 840 114" role="img" aria-label="Live CVE feed filtered to my stack: 1 recent advisories, highest severity LOW.">
<title>Live CVE feed filtered to my stack: 1 recent advisories, highest severity LOW.</title>

<rect width="840" height="114" fill="#0d1117"/>
<rect x="18" y="14" width="804" height="86" rx="7" fill="#0a0f16" stroke="#1e2836"/>
<text x="38" y="42" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="10" fill="#3d4756" letter-spacing="2.5">CVE FEED · MATCHED TO MY STACK · NVD</text>
<circle cx="800" cy="38" r="3.5" fill="#3fb950">
  <animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
<line x1="38" y1="54" x2="802" y2="54" stroke="#1e2836"/>
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur=".5s" begin="0.30s" fill="freeze"/>
  <text x="38" y="76" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11.5" fill="#8b949e">feed unavailable</text>
  <rect x="176" y="65" width="46" height="15" rx="3" fill="#8b949e" fill-opacity=".16"/>
  <text x="199" y="76" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" fill="#8b949e" text-anchor="middle">LOW</text>
  <text x="240" y="76" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11.5" fill="#e6edf3">retrying next run</text>
  <text x="802" y="76" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#5a6675" text-anchor="end"></text>
  <line x1="38" y1="85" x2="802" y2="85" stroke="#1e2836" stroke-opacity=".55"/>
</g>

</svg>
