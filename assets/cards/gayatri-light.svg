<svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 400 150" role="img" aria-label="Gayatri Enterprises — B2B chemicals platform covering orders, inventory and invoicing for a manufacturer. Built with Laravel · React.">
<title>Gayatri Enterprises — B2B chemicals platform covering orders, inventory and invoicing for a manufacturer. Built with Laravel · React.</title>

<defs>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8250df" stop-opacity=".09"/>
    <stop offset="60%" stop-color="#8250df" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="corner" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#bf3989" stop-opacity=".12"/>
    <stop offset="70%" stop-color="#bf3989" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#bf3989"/><stop offset="100%" stop-color="#0f8b93"/>
  </linearGradient>
</defs>

<rect width="400" height="150" fill="#ffffff"/>
<rect x="1" y="1" width="398" height="148" rx="10" fill="#f6f8fa" stroke="#c2cbd6"/>
<rect x="1" y="1" width="398" height="148" rx="10" fill="url(#glow)"/>
<rect x="290" y="1" width="109" height="80" fill="url(#corner)"/>

<rect x="1" y="146" width="0" height="3" rx="1.5" fill="url(#edge)">
  <animate attributeName="width" values="0;398;0" dur="6s" repeatCount="indefinite"
    keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
</rect>

<text x="22" y="32" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="10.5" fill="#bf3989" letter-spacing="2.4">ERP</text>

<text x="22" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1f2328">Gayatri Enterprises</text>
<rect x="197.29999999999998" y="45" width="40.8" height="16" rx="8" fill="#1a7f37" fill-opacity=".14" stroke="#1a7f37" stroke-opacity=".45"/>
<text x="217.7" y="56.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="9" fill="#1a7f37"
      text-anchor="middle" letter-spacing="1">LIVE</text>

<text x="22" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">B2B chemicals platform covering orders,</text>
<text x="22" y="95" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">inventory and invoicing for a manufacturer.</text>

<text x="22" y="130" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="11" fill="#0f8b93">Laravel · React</text>

</svg>
